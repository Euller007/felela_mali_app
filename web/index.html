    // Ao fazer refresh numa rota que nao seja a raiz,
    // redireciona para o inicio para evitar erros de estado perdido

      var path = window.location.hash;
      if (path && path !== '#/' && path !== '#/home') {
        window.location.hash = '/';
      }
    })();
